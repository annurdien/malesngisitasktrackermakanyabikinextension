<!DOCTYPE html>
<html>
<head>
  <title>Jira Task Tracker Options</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; max-width: 600px; }
    textarea { width: 100%; height: 200px; font-family: monospace; }
    button { padding: 10px 15px; margin-top: 10px; background: #0c66e4; color: white; border: none; cursor: pointer; border-radius: 3px; }
    button:hover { background: #0052cc; }
    #status { margin-top: 10px; color: green; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Jira Task Tracker Settings</h2>
  
  <p><strong>Google Sheets Configuration</strong></p>
  <div style="margin-bottom: 15px; background: #f4f5f7; padding: 15px; border-radius: 4px; border: 1px solid #dfe1e6;">
    <label for="spreadsheetUrl" style="display:block; margin-bottom: 5px; font-weight: 500;">Paste Full Spreadsheet URL (Auto-Extract):</label>
    <input type="text" id="spreadsheetUrl" placeholder="https://docs.google.com/spreadsheets/d/.../edit?gid=..." style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 3px;">
    <div style="margin-top: 5px; font-size: 12px; color: #5e6c84;" id="extractStatus">Paste URL here to automatically fill the IDs below.</div>
  </div>
  
  <div style="margin-bottom: 15px;">
    <label for="spreadsheetId" style="display:block; margin-bottom: 5px;">Spreadsheet ID:</label>
    <input type="text" id="spreadsheetId" placeholder="e.g. 1GMTqEJkaygiCfkmbbQL-ayLpH-Snk4If-hb0MTX8-_8" style="width: 100%; padding: 8px; box-sizing: border-box;">
  </div>
  <div style="margin-bottom: 25px;">
    <label for="sheetId" style="display:block; margin-bottom: 5px;">Sheet ID (gid):</label>
    <input type="text" id="sheetId" placeholder="e.g. 1985582970" style="width: 100%; padding: 8px; box-sizing: border-box;">
  </div>

  <p><strong>Service Account Credentials</strong></p>
  <p style="font-size: 13px; color: #555; margin-top: -10px;">Paste the contents of your Google Service Account <code>credentials.json</code> below:</p>
  <textarea id="credentials" placeholder='{\n  "type": "service_account",\n  "project_id": "...",\n  "private_key_id": "...",\n  "private_key": "-----BEGIN PRIVATE KEY-----\\n...",\n  "client_email": "...",\n  "client_id": "...",\n  "auth_uri": "https://accounts.google.com/o/oauth2/auth",\n  "token_uri": "https://oauth2.googleapis.com/token",\n  "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",\n  "client_x509_cert_url": "..."\n}'></textarea>
  
  <p><strong>Preferences</strong></p>
  <div style="margin-bottom: 25px;">
    <label style="display:flex; align-items:center; cursor:pointer;">
      <input type="checkbox" id="showSuccessAnimation" checked style="margin-right: 8px;">
      Show Success Animation
    </label>
  </div>

  <button id="save">Save Settings</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
